<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic-Nodes | Auto Tech Blog</title>
    <meta name="description" content="AI-Driven Autonomous Technical Knowledge Base and Tech Blog">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://hakutaku-blog.github.io/logic-nodes/">
    
    <!-- Open Graph (OGP) Meta Tags for Social & SEO -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Logic-Nodes | Auto Tech Blog">
    <meta property="og:description" content="AI-Driven Autonomous Technical Knowledge Base and Tech Blog">
    <meta property="og:url" content="https://hakutaku-blog.github.io/logic-nodes/">
    <meta property="og:site_name" content="Logic-Nodes">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Google Search Console (GSC) 所有権確認用メタタグ -->
    <meta name="google-site-verification" content="googlea94bd98fb2babc4a" />

    <!-- Google Analytics 4 (GA4) アクセス解析タグ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W36F6F9RV9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      window.GA_MEASUREMENT_ID = 'G-W36F6F9RV9';
      gtag('config', window.GA_MEASUREMENT_ID);
    </script>

    <!-- Google AdSense 審査用・自動広告タグ -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2248754336859319"
     crossorigin="anonymous"></script>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --tag-bg: #1e293b;
            --tag-active-bg: #38bdf8;
            --tag-active-text: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        header p {
            margin: 0.5rem 0 0;
            color: var(--text-sub);
            font-size: 1rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* 検索 & フィルターエリア */
        .controls {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .tag-btn {
            background: var(--bg-color);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .tag-btn.active {
            background: var(--tag-active-bg);
            color: var(--tag-active-text);
            border-color: var(--tag-active-bg);
            font-weight: 700;
        }

        /* 記事一覧リスト */
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .post-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-title {
            margin: 0 0 0.8rem 0;
            font-size: 1.45rem;
            line-height: 1.4;
        }

        .post-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .post-title a:hover {
            color: var(--accent);
        }

        .post-description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
            line-height: 1.6;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .post-tag {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .post-tag:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        /* モーダル表示 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            overflow-y: auto;
            padding: 2rem 1rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 840px;
            margin: 0 auto;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: var(--text-sub);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
            background: var(--accent-hover);
        }

        /* Markdown出力スタイル */
        .markdown-body {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
            margin-top: 1.8rem;
        }

        .markdown-body p {
            margin-bottom: 1.2rem;
        }

        .markdown-body code {
            background: var(--bg-color);
            color: #e2e8f0;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: var(--bg-color);
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 1.5rem;
            margin-bottom: 1.2rem;
        }

        .markdown-body hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        footer {
            margin-top: 4rem;
            padding: 2rem 1rem;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-sub);
            font-size: 0.9rem;
            background: var(--card-bg);
        }

        footer a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Logic-Nodes</h1>
        <p>AI-Driven Autonomous Technical Knowledge Base</p>
    </header>

    <div class="container">
        <!-- 検索 & フィルターエリア -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="キーワードで記事を検索（タイトル・タグ・概要・本文）...">
            <div class="tag-list" id="tagList">
                <button class="tag-btn active" data-tag="ALL">ALL</button>
            </div>
        </div>

        <!-- 記事一覧リスト -->
        <div id="postsContainer" class="loading-spinner">記事データを読み込んでいます...</div>
    </div>

    <!-- 記事詳細モーダル -->
    <div id="articleModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalBody" class="markdown-body"></div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom: 0.8rem; display: flex; justify-content: center; gap: 1.8rem; flex-wrap: wrap;">
            <a href="./privacy.html">プライバシーポリシー</a>
            <a href="./about.html">運営者情報 & お問い合わせ</a>
        </div>
        <div>&copy; 2026 Logic-Nodes. All rights reserved.</div>
    </footer>

    <script>
        let allPosts = [];
        let activeTag = 'ALL';

        // 基準となる src/posts/ ディレクトリの絶対URLを取得
        function getPostsBaseUrl() {
            let path = window.location.pathname;
            if (path.endsWith('.html')) {
                path = path.substring(0, path.lastIndexOf('/'));
            }
            if (!path.endsWith('/')) {
                path += '/';
            }
            return window.location.origin + path + 'src/posts/';
        }

        // YAML Frontmatter をパースする関数 (コードブロック囲み等も耐性向上)
        function parseFrontmatter(text) {
            let cleanedText = text.trim();
            
            // AI生成時の ```yaml 囲みを事前トリミング
            if (cleanedText.startsWith('```yaml')) {
                cleanedText = cleanedText.replace(/^```yaml\s*/, '');
            } else if (cleanedText.startsWith('```markdown')) {
                cleanedText = cleanedText.replace(/^```markdown\s*/, '');
            } else if (cleanedText.startsWith('```')) {
                cleanedText = cleanedText.replace(/^```\s*/, '');
            }

            const pattern = /^---\s*[\r\n]+([\s\S]*?)[\r\n]+---\s*[\r\n]*([\s\S]*)$/;
            const match = cleanedText.match(pattern);
            
            if (!match) {
                return { metadata: {}, content: text };
            }

            const yamlText = match[1];
            let content = match[2].trim();

            if (content.endsWith('```')) {
                content = content.slice(0, -3).trim();
            }

            const metadata = {};
            const yamlLines = yamlText.split(/\r?\n/);
            yamlLines.forEach(line => {
                const colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    const key = line.slice(0, colonIndex).trim();
                    let value = line.slice(colonIndex + 1).trim();
                    
                    if (key) {
                        if (value.startsWith('[') && value.endsWith(']')) {
                            try {
                                metadata[key] = JSON.parse(value);
                            } catch (e) {
                                metadata[key] = value.slice(1, -1)
                                    .split(',')
                                    .map(s => s.trim().replace(/^['"]|['"]$/g, ''));
                            }
                        } else {
                            metadata[key] = value.replace(/^['"]|['"]$/g, '');
                        }
                    }
                }
            });

            return { metadata, content };
        }

        // ./src/posts/ 配下の Markdown 記事を取得（外部API制限なし・ブラウザキャッシュ無効化）
        async function fetchPosts() {
            const container = document.getElementById('postsContainer');
            const baseUrl = getPostsBaseUrl();
            const cacheBust = '?_t=' + Date.now();
            try {
                let filenames = [];
                
                // 1. 静的マニフェストファイル (src/posts/posts.json) から読み込み
                try {
                    const res = await fetch(baseUrl + 'posts.json' + cacheBust, { cache: 'no-store' });
                    if (res.ok) {
                        filenames = await res.json();
                    }
                } catch (e) {
                    console.warn('posts.json load fallback:', e);
                }

                // 2. フォールバック: GitHub API (マニフェスト未構築時などの補助)
                if (!filenames || filenames.length === 0) {
                    try {
                        let repoPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
                        const apiUrl = `https://api.github.com/repos${repoPath}/contents/src/posts`;
                        const apiRes = await fetch(apiUrl, { cache: 'no-store' });
                        if (apiRes.ok) {
                            const files = await apiRes.json();
                            filenames = files
                                .filter(f => f.name.endsWith('.md') && f.name !== 'README.md')
                                .map(f => f.name);
                        }
                    } catch (e) {}
                }

                // 3. 既知ファイル直接フォールバック
                if (!filenames || filenames.length === 0) {
                    const todayStr = new Date().toISOString().split('T')[0];
                    filenames = ['2026-07-28-auto-generated.md', '2026-07-27-auto-article.md', `${todayStr}-auto-generated.md`];
                }

                allPosts = [];
                for (const fname of filenames) {
                    if (typeof fname !== 'string' || !fname.endsWith('.md')) continue;
                    try {
                        const res = await fetch(baseUrl + fname + cacheBust, { cache: 'no-store' });
                        if (res.ok) {
                            const rawText = await res.text();
                            const { metadata, content } = parseFrontmatter(rawText);

                            allPosts.push({
                                filename: fname,
                                title: metadata.title || fname.replace('.md', ''),
                                date: metadata.date || fname.slice(0, 10),
                                tags: Array.isArray(metadata.tags) ? metadata.tags : (metadata.tags ? [metadata.tags] : []),
                                description: metadata.description || '概要なし',
                                content: content
                            });
                        }
                    } catch (err) {
                        console.error(`Failed to load post ${fname}:`, err);
                    }
                }

                // 重複除去 (filename基準)
                const uniqueMap = new Map();
                allPosts.forEach(p => uniqueMap.set(p.filename, p));
                allPosts = Array.from(uniqueMap.values());

                // 日付降順ソート
                allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderTagButtons();
                renderPosts();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color: #ef4444;">記事を取得できませんでした。./src/posts/ の配置をご確認ください。</p>`;
            }
        }

        // タグフィルターボタンの動的生成
        function renderTagButtons() {
            const tagListContainer = document.getElementById('tagList');
            const tagsSet = new Set();

            allPosts.forEach(post => {
                post.tags.forEach(tag => tagsSet.add(tag));
            });

            const tags = ['ALL', ...Array.from(tagsSet)];
            tagListContainer.innerHTML = tags.map(tag => 
                `<button class="tag-btn ${tag === activeTag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</button>`
            ).join('');
        }

        // 記事一覧のレンダリング
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();

            const filteredPosts = allPosts.filter(post => {
                const matchesTag = activeTag === 'ALL' || post.tags.includes(activeTag);
                const matchesSearch = searchQuery === '' || 
                                      post.title.toLowerCase().includes(searchQuery) || 
                                      post.description.toLowerCase().includes(searchQuery) ||
                                      post.content.toLowerCase().includes(searchQuery) ||
                                      post.tags.some(t => t.toLowerCase().includes(searchQuery));
                return matchesTag && matchesSearch;
            });

            if (filteredPosts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub); text-align: center; padding: 2rem 0;">該当する記事が見つかりません。</p>';
                return;
            }

            container.innerHTML = filteredPosts.map((post) => `
                <div class="post-card">
                    <div class="post-meta">
                        <span>📅 ${post.date}</span>
                    </div>
                    <h2 class="post-title">
                        <a href="#" onclick="openModal(${allPosts.indexOf(post)}); return false;">${post.title}</a>
                    </h2>
                    <div class="post-description">${post.description}</div>
                    <div class="post-tags">
                        ${post.tags.map(t => `<span class="post-tag" onclick="filterByTag('${t}'); event.stopPropagation();">#${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function filterByTag(tag) {
            activeTag = tag;
            renderTagButtons();
            renderPosts();
        }

        document.getElementById('searchInput').addEventListener('input', renderPosts);

        function openModal(index) {
            const post = allPosts[index];
            const modal = document.getElementById('articleModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                <h1 style="margin-top:0;">${post.title}</h1>
                <div style="color: var(--text-sub); margin-bottom: 1.5rem; font-size:0.9rem;">
                    📅 ${post.date} | ${post.tags.map(t => `#${t}`).join(' ')}
                </div>
                ${marked.parse(post.content)}
            `;

            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';

            // GA4 記事閲覧イベント送信
            if (typeof gtag === 'function' && window.GA_MEASUREMENT_ID) {
                gtag('event', 'select_content', {
                    content_type: 'article',
                    item_id: post.filename,
                    title: post.title
                });
            }
        }

        function closeModal() {
            document.getElementById('articleModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('articleModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        fetchPosts();
    </script>
</body>
</html>
