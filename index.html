<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic-Nodes | Auto Tech Blog</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --tag-bg: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.2rem;
            letter-spacing: 0.05em;
        }

        header p {
            margin: 0.5rem 0 0;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* 検索 & フィルターエリア */
        .controls {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .search-box {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-btn {
            background: var(--tag-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: bold;
        }

        /* 記事一覧リスト */
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .post-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .post-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-title {
            margin: 0 0 0.8rem 0;
            font-size: 1.4rem;
        }

        .post-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .post-title a:hover {
            color: var(--accent);
        }

        .post-description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .post-tags {
            display: flex;
            gap: 0.4rem;
        }

        .post-tag {
            font-size: 0.75rem;
            background: var(--bg-color);
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* モーダル表示 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            overflow-y: auto;
            padding: 2rem 1rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        /* Markdown出力スタイル */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
        }

        .markdown-body code {
            background: var(--bg-color);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
        }

        .markdown-body pre {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Logic-Nodes</h1>
        <p>AI-Driven Autonomous Technical Knowledge Base</p>
    </header>

    <div class="container">
        <!-- 検索・フィルターエリア -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="キーワードで記事を検索...">
            <div class="tag-list" id="tagList">
                <button class="tag-btn active" data-tag="ALL">ALL</button>
            </div>
        </div>

        <!-- 記事一覧リスト -->
        <div id="postsContainer">Loading knowledge...</div>
    </div>

    <!-- 記事詳細モーダル -->
    <div id="articleModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalBody" class="markdown-body"></div>
        </div>
    </div>

    <script>
        let allPosts = [];
        let activeTag = 'ALL';

        // YAML Frontmatter を簡単にパースする関数
        function parseFrontmatter(text) {
            const pattern = /^---\s*[\r\n]+([\s\S]*?)[\r\n]+---\s*[\r\n]+([\s\S]*)$/;
            const match = text.match(pattern);
            
            if (!match) {
                return { metadata: {}, content: text };
            }

            const yamlLines = match[1].split('\n');
            const metadata = {};

            yamlLines.forEach(line => {
                const [key, ...valueParts] = line.split(':');
                if (key && valueParts.length > 0) {
                    let value = valueParts.join(':').trim();
                    // 配列構文 [tag1, tag2] の簡易パース
                    if (value.startsWith('[') && value.endsWith(']')) {
                        value = value.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
                    } else {
                        value = value.replace(/^['"]|['"]$/g, '');
                    }
                    metadata[key.trim()] = value;
                }
            });

            return { metadata, content: match[2] };
        }

        // GitHub APIから記事一覧を取得する
        async function fetchPosts() {
            const container = document.getElementById('postsContainer');
            try {
                // src/posts 配下のファイルを取得
                const response = await fetch('https://api.github.com/repos/hakutaku/logic-nodes/contents/src/posts');
                
                if (!response.ok) {
                    throw new Error('記事リストの取得に失敗しました');
                }

                const files = await response.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md'));

                allPosts = await Promise.all(mdFiles.map(async (file) => {
                    const res = await fetch(file.download_url);
                    const rawText = await res.text();
                    const { metadata, content } = parseFrontmatter(rawText);

                    return {
                        filename: file.name,
                        title: metadata.title || file.name.replace('.md', ''),
                        date: metadata.date || 'Unknown Date',
                        tags: Array.isArray(metadata.tags) ? metadata.tags : (metadata.tags ? [metadata.tags] : []),
                        description: metadata.description || '概要なし',
                        content: content
                    };
                }));

                // 日付昇順（新しい順）にソート
                allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

                renderTagButtons();
                renderPosts();

            } catch (err) {
                container.innerHTML = `<p style="color: #ef4444;">エラーが発生しました: ${err.message}</p>`;
            }
        }

        // タグフィルターボタンの動的作成
        function renderTagButtons() {
            const tagListContainer = document.getElementById('tagList');
            const tagsSet = new Set();

            allPosts.forEach(post => {
                post.tags.forEach(tag => tagsSet.add(tag));
            });

            const tags = ['ALL', ...Array.from(tagsSet)];
            tagListContainer.innerHTML = tags.map(tag => 
                `<button class="tag-btn ${tag === activeTag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</button>`
            ).join('');
        }

        // 記事一覧のレンダリング（検索・タグ絞り込み適用）
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            const filteredPosts = allPosts.filter(post => {
                const matchesTag = activeTag === 'ALL' || post.tags.includes(activeTag);
                const matchesSearch = post.title.toLowerCase().includes(searchQuery) || 
                                      post.description.toLowerCase().includes(searchQuery);
                return matchesTag && matchesSearch;
            });

            if (filteredPosts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub);">該当する記事が見つかりません。</p>';
                return;
            }

            container.innerHTML = filteredPosts.map((post, index) => `
                <div class="post-card">
                    <div class="post-meta">
                        <span>📅 ${post.date}</span>
                    </div>
                    <h2 class="post-title">
                        <a href="#" onclick="openModal(${allPosts.indexOf(post)}); return false;">${post.title}</a>
                    </h2>
                    <div class="post-description">${post.description}</div>
                    <div class="post-tags">
                        ${post.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // フィルター操作
        function filterByTag(tag) {
            activeTag = tag;
            renderTagButtons();
            renderPosts();
        }

        document.getElementById('searchInput').addEventListener('input', renderPosts);

        // モーダル表示処理
        function openModal(index) {
            const post = allPosts[index];
            const modal = document.getElementById('articleModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `
                <h1 style="margin-top:0;">${post.title}</h1>
                <div style="color: var(--text-sub); margin-bottom: 1.5rem; font-size:0.9rem;">
                    📅 ${post.date} | ${post.tags.map(t => `#${t}`).join(' ')}
                </div>
                ${marked.parse(post.content)}
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('articleModal').style.display = 'none';
        }

        // 外枠クリックで閉じる
        window.onclick = function(event) {
            const modal = document.getElementById('articleModal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // 初期化実行
        fetchPosts();
    </script>
</body>
</html>
