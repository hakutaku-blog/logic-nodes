name: Auto Generate and Publish Blog Post

on:
  schedule:
    # 毎日 朝7:00 (JST) に自動実行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動で即時テスト実行したい時用

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Daily Article via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > generate.py
          import os
          from datetime import datetime
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          today = datetime.now().strftime("%Y-%m-%d")

          prompt = f"""
          あなたは「Logic-Nodes」のAI技術ライターです。
          本日の日付: {today}

          エンジニア向けに、最新のAIツール（Cursor, MCP, LLM API等）やインフラ・CI/CDに関する
          「現場で役に立つ地雷回避・実践ハック」をテーマにしたMarkdown形式の技術記事を執筆してください。

          【構成要件】
          - Frontmatter（title, date, tagsなど）を先頭に含めること
          - 読者がすぐに試せる具体的な設定例やコードブロックを含めること
          - 導入、問題の背景、解決策、まとめの構成にすること
          """

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )

          # posts フォルダに保存 (ディレクトリがなければ自動作成)
          os.makedirs("src/posts", exist_ok=True)
          filename = f"src/posts/{today}-auto-article.md"
          
          with open(filename, "w", encoding="utf-8") as f:
              f.write(response.text)

          print(f"Successfully generated: {filename}")
          EOF
          python generate.py

      - name: Commit and Push generated article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-generate daily article [skip ci]" || exit 0
          git push
