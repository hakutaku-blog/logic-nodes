name: Auto Generate and Publish Blog Post

on:
  schedule:
    - cron: '17 18 * * *' # 日本時間 深夜3:17 (GitHubの混雑状況を避けるため深夜帯の半端な時間を指定)
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 3.10から3.11へアップデート

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-analytics-data google-auth

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python generate.py

      - name: Commit and Push generated article and/or model blacklist
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-update daily article and model blacklist [skip ci]" || exit 0
          git push
