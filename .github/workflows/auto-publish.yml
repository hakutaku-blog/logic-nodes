name: Auto Generate and Publish Blog Post

on:
  schedule:
    # 毎日 朝7:00 (JST) に自動実行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動で即時テスト実行したい時用

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Daily Article via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > generate.py
          import os
          import sys
          from datetime import datetime
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("ERROR: GEMINI_API_KEY is not set.")
              sys.exit(1)

          client = genai.Client()
          today = datetime.now().strftime("%Y-%m-%d")

          prompt = f"""
          あなたは技術ブログ「Logic-Nodes」の最高峰AIシニアライターです。
          本日の日付: {today}

          現役エンジニアに向けて、最新のAIツール（Cursor, MCP, LLM API等）やインフラ・CI/CDに関する
          「現場で直面する地雷の回避策・実践的コードハック」をテーマにした高品質なMarkdown記事を執筆してください。

          【厳格な執筆ルール・制約事項】
          1. 誤字・脱字・不自然な日本語表現を徹底的に自己校正すること。
          2. 実在しない公式X（旧Twitter）、SNSアカウント、メルマガ等の宣伝・リンク・誘導文は一切記載しないこと。
          3. 記事の終わりは解説のまとめで簡潔に締めくくり、余計な挨拶やSNSシェアの呼びかけは含めないこと。
          4. 読者が即座にコピペ・実行できる具体的なコードブロック（YAML, Python, Bash等）と設定例を必ず含めること。

          【構成要件】
          - 冒頭にFrontmatter（title, date, tags）を含める
          - 導入（何が起きているか）
          - 原因と技術的背景
          - 解決策・具体的なコード／設定手順
          - まとめ
          """

          candidate_models = [
              'gemini-2.5-flash',
              'gemini-2.0-flash',
              'gemini-1.5-flash',
          ]

          response = None
          used_model = None

          for m in candidate_models:
              try:
                  print(f"Trying model: {m}...")
                  response = client.models.generate_content(
                      model=m,
                      contents=prompt,
                  )
                  used_model = m
                  print(f"Success with model: {m}")
                  break
              except Exception as e:
                  print(f"Model {m} failed: {e}")

          if not response:
              print("Fallback: Searching available models dynamically...")
              try:
                  for m in client.models.list():
                      if "generateContent" in getattr(m, "supported_generation_methods", []) or "flash" in m.name:
                          try:
                              print(f"Trying fallback model: {m.name}...")
                              response = client.models.generate_content(
                                  model=m.name,
                                  contents=prompt,
                              )
                              used_model = m.name
                              print(f"Success with fallback model: {m.name}")
                              break
                          except Exception as inner_e:
                              print(f"Fallback model {m.name} failed: {inner_e}")
              except Exception as list_e:
                  print(f"Failed to list models: {list_e}")

          if not response or not response.text:
              print("CRITICAL ERROR: All models failed to generate content.")
              sys.exit(1)

          os.makedirs("src/posts", exist_ok=True)
          filename = f"src/posts/{today}-auto-article.md"
          
          with open(filename, "w", encoding="utf-8") as f:
              f.write(response.text)

          print(f"Successfully generated article using [{used_model}]: {filename}")
          EOF
          python generate.py

      - name: Commit and Push generated article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-generate daily article [skip ci]" || exit 0
          git push
